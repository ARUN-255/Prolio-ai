name: Full Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prolio
          POSTGRES_PASSWORD: prolio
          POSTGRES_DB: prolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U prolio -d prolio_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_USER: prolio
      DB_PASSWORD: prolio
      DB_NAME: prolio_test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-test-secret-only
      PORT: 5000
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            Backend/package-lock.json
            Frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: Backend
        run: npm install --package-lock=false

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Backend syntax check
        working-directory: Backend
        run: npm run check

      - name: Frontend production build
        working-directory: Frontend
        run: npm run build

      - name: Initialize database
        env:
          PGPASSWORD: prolio
        run: psql -h 127.0.0.1 -U prolio -d prolio_test -f Backend/Database/schema.sql

      - name: Start backend
        working-directory: Backend
        run: |
          npm start > /tmp/prolio-backend.log 2>&1 &
          echo $! > /tmp/prolio-backend.pid

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/prolio-backend.log
          exit 1

      - name: Full API smoke test
        shell: bash
        run: bash Backend/tests/full-smoke.sh

      - name: Show backend log on failure
        if: failure()
        run: cat /tmp/prolio-backend.log || true
