name: Full Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prolio
          POSTGRES_PASSWORD: prolio
          POSTGRES_DB: prolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U prolio -d prolio_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_USER: prolio
      DB_PASSWORD: prolio
      DB_NAME: prolio_test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-test-secret-only
      PORT: 5000
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            Backend/package-lock.json
            Frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: Backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Backend syntax check
        working-directory: Backend
        run: npm run check

      - name: Frontend production build
        working-directory: Frontend
        run: npm run build

      - name: Initialize database
        env:
          PGPASSWORD: prolio
        run: psql -h 127.0.0.1 -U prolio -d prolio_test -f Backend/Database/schema.sql

      - name: Start backend
        working-directory: Backend
        run: |
          npm start > /tmp/prolio-backend.log 2>&1 &
          echo $! > /tmp/prolio-backend.pid

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/prolio-backend.log
          exit 1

      - name: Auth and recruiter invitation integration test
        shell: bash
        run: |
          set -euo pipefail

          STUDENT=$(curl --fail --silent -X POST http://127.0.0.1:5000/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI Student","email":"student-ci@prolio.test","password":"TestPass123!","role":"student"}')

          RECRUITER=$(curl --fail --silent -X POST http://127.0.0.1:5000/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI Recruiter","email":"recruiter-ci@prolio.test","password":"TestPass123!","role":"recruiter"}')

          STUDENT_TOKEN=$(node -e 'const x=JSON.parse(process.argv[1]); if(!x.token) process.exit(1); process.stdout.write(x.token)' "$STUDENT")
          RECRUITER_TOKEN=$(node -e 'const x=JSON.parse(process.argv[1]); if(!x.token) process.exit(1); process.stdout.write(x.token)' "$RECRUITER")

          curl --fail --silent -X POST http://127.0.0.1:5000/api/students/portfolio \
            -H "Authorization: Bearer $STUDENT_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"headline":"Full Stack Developer","bio":"CI profile","location":"Tamil Nadu, India","isPublic":true}' >/tmp/profile.json

          CANDIDATES=$(curl --fail --silent http://127.0.0.1:5000/api/recruiter/candidates/search \
            -H "Authorization: Bearer $RECRUITER_TOKEN")

          CANDIDATE_ID=$(node -e 'const x=JSON.parse(process.argv[1]); if(!x.candidates?.length) process.exit(1); process.stdout.write(String(x.candidates[0].id))' "$CANDIDATES")

          INVITE=$(curl --fail --silent -X POST http://127.0.0.1:5000/api/recruiter/invitations \
            -H "Authorization: Bearer $RECRUITER_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"candidate_id\":$CANDIDATE_ID,\"message\":\"We would like to discuss an opportunity with you.\"}")

          node -e 'const x=JSON.parse(process.argv[1]); if(!x.success || !x.invitation?.id) { console.error(x); process.exit(1); }' "$INVITE"

          INVITES=$(curl --fail --silent http://127.0.0.1:5000/api/recruiter/invitations \
            -H "Authorization: Bearer $RECRUITER_TOKEN")

          node -e 'const x=JSON.parse(process.argv[1]); if(x.count !== 1 || x.invitations?.[0]?.candidate_name !== "CI Student") { console.error(x); process.exit(1); }' "$INVITES"

      - name: Show backend log on failure
        if: failure()
        run: cat /tmp/prolio-backend.log || true
